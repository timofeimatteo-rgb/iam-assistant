<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I AM</title>
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-window="main">
<div class="app">
  <!-- ============ БОКОВАЯ ПАНЕЛЬ ============ -->
  <aside class="side" id="side">
    <div class="side-top">
      <img class="logo" src="assets/logo.svg" alt="I AM+">
      <button class="icon-btn" id="sideClose" title="Скрыть панель"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <nav class="side-nav tabs">
      <button data-tab="work" aria-selected="true"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Чат</button>
      <button data-tab="settings" aria-selected="false"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
    </nav>

    <section class="side-sec">
      <div class="sec-head"><span>Сегодня</span><span class="muted" id="taskCount"></span></div>
      <form id="addTask" class="add-task">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <input id="taskInput" placeholder="Новая задача" maxlength="300" autocomplete="off">
      </form>
      <ul class="task-list" id="taskList"></ul>
      <div class="reminders" id="customReminders"></div>
    </section>

    <section class="timer-card">
      <div class="current" id="currentTask"></div>
      <div class="timer">
        <div class="t-row">
          <div>
            <div class="digits" id="timerDigits">25:00</div>
            <div class="phase" id="timerPhase">Фокус</div>
          </div>
          <span class="spacer"></span>
          <button class="icon-btn" id="timerStop" title="Сброс"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button class="icon-btn" id="timerBreak" title="Перерыв"><svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg></button>
          <button class="play" id="timerMain" title="Старт / пауза" aria-label="Старт"></button>
        </div>
        <div class="progress"><i id="timerBar"></i></div>
        <div class="focus-count" id="focusCount"></div>
      </div>
    </section>
  </aside>

  <!-- ============ ОСНОВНАЯ ОБЛАСТЬ ============ -->
  <div class="main">
    <header class="top">
      <button class="icon-btn" id="sideOpen" title="Показать панель" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <button class="model-pill" id="llmChip" title="Модель ИИ"><i></i><span>Нет модели</span><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="spacer"></span>
      <button class="icon-btn" id="dndChip" title="Не беспокоить"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span></span></button>
      <button class="icon-btn" id="chatClear" title="Новый разговор (очистить историю)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>

    <main id="view-work" class="chat">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-col" id="chatLog" aria-live="polite"></div>
      </div>
      <div class="composer-wrap">
        <div class="chat-hints" id="chatHints">
          <button class="hint">Напомни через 20 минут выпить воды</button>
          <button class="hint">Добавь задачу подготовить бриф</button>
          <button class="hint">Помоги начать работу</button>
          <button class="hint">Станцуй!</button>
        </div>
        <form class="composer" id="composer">
          <textarea id="chatInput" rows="1" placeholder="Напишите сообщение"></textarea>
          <button class="send" id="sendBtn" type="submit" title="Отправить" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          <button class="send stop" id="stopBtn" type="button" title="Остановить" aria-label="Остановить" hidden><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
        </form>
        <div class="foot muted">Работает на вашем компьютере. Переписка никуда не отправляется.</div>
      </div>
    </main>

    <main id="view-settings" class="settings" hidden>
      <nav class="snav">
        <a href="#s-mascot">Маскот</a><a href="#s-model">Модель ИИ</a><a href="#s-remind">Напоминания</a><a href="#s-hours">Рабочие часы</a>
        <a href="#s-timer">Таймер</a><a href="#s-data">Память и данные</a><a href="#s-system">Система</a><a href="#s-about">О программе</a>
      </nav>
      <div class="scontent" id="settingsRoot"></div>
    </main>
  </div>
</div>

<!-- ============ ПЕРВЫЙ ЗАПУСК ============ -->
<div class="overlay" id="welcome" hidden>
  <div class="modal wizard">
    <div class="wiz-step muted" id="wizTitle"></div>
    <div id="wizBody"></div>
  </div>
</div>

<script type="module" src="js/app-main.js"></script>
</body>
</html>
