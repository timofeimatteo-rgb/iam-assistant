<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I AM — маскот</title>
<link rel="stylesheet" href="css/brand.css">
<style>
  html, body { background: transparent !important; overflow: hidden; height: 100%; user-select: none; -webkit-user-select: none; }
  #root { position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 6px; }
  #row { display: flex; align-items: flex-end; gap: 6px; }
  #wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  #sprite { background-repeat: no-repeat; cursor: grab; image-rendering: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
  #sprite:active { cursor: grabbing; }
  #chip { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); background: #0D0D0F; color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #chip.break { background: var(--blue); }
  #chip.paused { background: #A1A1AA; }
  #dndBadge { position: absolute; top: 6px; right: 0; background: #fff; color: #3F3F46; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  /* компактная панель управления */
  #panel { display: flex; flex-direction: column; gap: 2px; background: rgba(255,255,255,.96); border-radius: 14px; padding: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.12); }
  #panel button { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; cursor: pointer; padding: 0; color: #3F3F46; }
  #panel button:hover { background: #F0F0F2; color: #0D0D0F; }
  #panel button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  #panel svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #panel .sep { height: 1px; background: #ECECEF; margin: 2px 6px; }

  /* реплика маскота */
  #bubble { width: 250px; background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.14); position: relative; margin-right: 10px; padding: 12px 14px; }
  #bubble .bar { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: #71717A; }
  #bubble .bar span { flex: 1; }
  #bubble .bar button { border: 0; background: transparent; color: #A1A1AA; cursor: pointer; width: 20px; height: 20px; font-size: 16px; line-height: 1; padding: 0; border-radius: 6px; }
  #bubble .bar button:hover { background: #F0F0F2; color: #0D0D0F; }
  #bubble .text { font-size: 14px; line-height: 1.45; color: #0D0D0F; }
  #bubble .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #bubble .acts .btn { min-height: 28px; padding: 3px 11px; font-size: 12px; }
  #bubble::after { content: ""; position: absolute; right: 44px; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); box-shadow: 3px 3px 4px rgba(0,0,0,.05); }
  #bubble.has-title .bar { display: flex; }
  #bubble:not(.has-title) .bar span { visibility: hidden; }
  #bubble:not(.has-title) .bar { position: absolute; right: 8px; top: 8px; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-window="mascot">
<div id="root">
  <div id="bubble" hidden role="status" aria-live="polite">
    <div class="bar"><span id="bubbleTitle"></span><button id="bubbleClose" title="Закрыть">×</button></div>
    <div class="text" id="bubbleText"></div>
    <div class="acts" id="bubbleActs"></div>
  </div>
  <div id="row">
    <nav id="panel" hidden aria-label="Панель управления">
      <button data-act="chat" title="Чат и задачи"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button data-act="timer" title="Таймер фокуса"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M9 3h6"/></svg></button>
      <button data-act="dance" title="Станцевать"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg></button>
      <button data-act="cheer" title="Подбодрить"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.6L20 9.3l-4.3 3.9L17 19l-5-3-5 3 1.3-5.8L4 9.3l5.6-.7z"/></svg></button>
      <div class="sep"></div>
      <button data-act="dnd" title="Не беспокоить 1 час"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button data-act="settings" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      <button data-act="hide" title="Скрыть в трей / строку меню"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </nav>
    <div id="wrap">
      <div id="sprite" role="img" aria-label="Маскот I AM"></div>
      <div id="chip" hidden></div>
      <div id="dndBadge" hidden>тихо</div>
    </div>
  </div>
</div>
<script type="module" src="js/app-mascot.js"></script>
</body>
</html>
