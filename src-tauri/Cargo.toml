[package]
name = "iam-assistant"
version = "0.1.0"
description = "I AM — помощник дизайн-студии с маскотом и локальным ИИ"
authors = ["I AM Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "iam_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "disk"] }

[profile.release]
# лёгкая сборка: оптимизация по размеру, без отладочной информации
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
