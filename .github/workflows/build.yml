name: Сборка I AM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты логики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/core.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            fetch: bash scripts/fetch-llama.sh
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
            verify: bash scripts/ci-verify-mac.sh
          - name: Windows x64
            os: windows-latest
            fetch: pwsh -File scripts/fetch-llama.ps1
            artifact: src-tauri/target/release/bundle/nsis/*.exe
            verify: pwsh -File scripts/ci-verify-win.ps1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Зависимости (Tauri CLI, шрифт)
        run: npm install --no-audit --no-fund
      - name: Шрифт Montserrat
        run: npm run fonts
      - name: Движок llama.cpp
        run: ${{ matrix.fetch }}
      - name: Сборка приложения
        run: npx tauri build
      - name: Размеры
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          ls -la ${{ matrix.artifact }} | tee -a $GITHUB_STEP_SUMMARY
          du -sh src-tauri/llama | tee -a $GITHUB_STEP_SUMMARY
          du -sh src/assets/mascot | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: I-AM-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Релиз (обновляется при каждой сборке main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: I AM 0.1.0
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Помощник студии I AM: маскот, задачи, таймер, напоминания и локальный ИИ.
            macOS (Apple Silicon): файл .dmg · Windows 10/11: файл -setup.exe
            Инструкция по установке — в README репозитория.
          files: ${{ matrix.artifact }}
      - name: Проверка на настоящей ОС (самопроверка приложения + локальная модель)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 60
        env:
          MODELS_TO_TEST: Qwen3.5-2B-Q4_K_M.gguf gemma-4-E2B-it-Q4_K_M.gguf
        run: ${{ matrix.verify }}
      - name: Публикация результатов проверки (ветка ci-results)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          B="ci-results-${{ matrix.os }}"
          mkdir -p /tmp/res && cp -r ci-out/. /tmp/res/
          git checkout --orphan "$B" && git rm -rfq . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/res/. . && echo "${{ github.sha }}" > COMMIT
          git add -A && git commit -qm "Результаты проверки ${{ github.sha }}" && git push -f origin "$B"
