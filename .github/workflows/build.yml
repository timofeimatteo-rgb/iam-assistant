name: Сборка I AM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты логики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/core.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            fetch: bash scripts/fetch-llama.sh
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            fetch: pwsh -File scripts/fetch-llama.ps1
            artifact: src-tauri/target/release/bundle/nsis/*.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Зависимости (Tauri CLI, шрифт)
        run: npm install --no-audit --no-fund
      - name: Шрифт Montserrat
        run: npm run fonts
      - name: Движок llama.cpp
        run: ${{ matrix.fetch }}
      - name: Сборка приложения
        run: npx tauri build
      - name: Размеры
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          ls -la ${{ matrix.artifact }} | tee -a $GITHUB_STEP_SUMMARY
          du -sh src-tauri/llama | tee -a $GITHUB_STEP_SUMMARY
          du -sh src/assets/mascot | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: I-AM-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
